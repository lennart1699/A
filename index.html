<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics Playground</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1013; overflow: hidden;
               font: 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
               color: #7c8698; -webkit-user-select: none; user-select: none; }
  canvas { display: block; }
  #legend { position: fixed; left: 14px; bottom: 12px; white-space: pre; pointer-events: none; }
  #legend b { color: #aab4c4; font-weight: normal; }

  #panel { position: fixed; top: 12px; right: 12px; width: 208px; padding: 10px 12px 11px;
           background: rgba(16, 19, 23, 0.72); border: 1px solid #272d36; color: #7c8698; }
  #panel h1 { margin: 0 0 8px; font-size: 11px; font-weight: normal; letter-spacing: .12em;
              text-transform: uppercase; color: #aab4c4; }
  #panel .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
  #panel .row span { color: #aab4c4; }
  #panel input[type=range] { width: 100%; height: 14px; margin: 0 0 7px; accent-color: #aab4c4;
                             background: transparent; }
  #panel label.check { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; cursor: pointer; }
  #panel label.check input { accent-color: #aab4c4; margin: 0; }
  #panel select { background: #14181d; color: #aab4c4; border: 1px solid #272d36;
                  font: inherit; padding: 1px 3px; }
  #panel .stats { margin-top: 9px; padding-top: 8px; border-top: 1px solid #272d36; }
  #panel .stats div { display: flex; justify-content: space-between; }
  #panel .stats b { color: #aab4c4; font-weight: normal; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="panel">
  <h1>Playground</h1>
  <div class="row" style="margin-bottom:7px"><span>scene</span>
    <select id="i-scene">
      <option value="cloth">cloth</option>
      <option value="rope">ropes</option>
      <option value="blob">blob</option>
      <option value="circles">circles</option>
      <option value="ragdoll">ragdolls</option>
      <option value="wheel">wheels</option>
      <option value="spring">springs</option>
      <option value="bridge">bridge</option>
      <option value="jelly">jelly</option>
      <option value="pendulum">pendulums</option>
      <option value="mixed">mixed</option>
    </select>
  </div>
  <div class="row"><span>gravity</span><b id="v-gravity"></b></div>
  <input type="range" id="i-gravity" min="0" max="2000" step="10">
  <div class="row"><span>wind</span><b id="v-wind"></b></div>
  <input type="range" id="i-wind" min="0" max="2000" step="10">
  <div class="row"><span>stiffness</span><b id="v-stiff"></b></div>
  <input type="range" id="i-stiff" min="0.05" max="1" step="0.05">
  <div class="row"><span>friction</span><b id="v-friction"></b></div>
  <input type="range" id="i-friction" min="0" max="1" step="0.05">
  <div class="row"><span>iterations</span><b id="v-iter"></b></div>
  <input type="range" id="i-iter" min="1" max="20" step="1">
  <label class="check"><input type="checkbox" id="i-gravity-on">gravity on <span style="color:#5d6675">(G)</span></label>
  <label class="check"><input type="checkbox" id="i-wind-on">wind on <span style="color:#5d6675">(W)</span></label>
  <div class="stats">
    <div><span>fps</span><b id="v-fps">--</b></div>
    <div><span>particles</span><b id="v-count">--</b></div>
    <div><span>constraints</span><b id="v-links">--</b></div>
  </div>
</div>
<div id="legend"></div>
<script>
"use strict";

/* ------------------------------------------------------------------ *
 * Core: Verlet point masses + distance constraints.
 *
 * A body owns its particles and implements two methods:
 *   satisfyConstraints(world)  -- called `iterations` times per fixed step
 *   draw(ctx, world)           -- called once per rendered frame
 * Everything else (integration, forces, picking, bounds) is the world's
 * job, so a new body type is one class and nothing more.
 * ------------------------------------------------------------------ */

class Particle {
  // Immovability is a mass, not a flag: invMass 0 means nothing can shift
  // this point. baseInvMass remembers what it weighs when it is let go, so
  // unpinning a heavy particle gives back its weight rather than a default.
  constructor(x, y, pinned = false, invMass = 1) {
    this.x = x; this.y = y;      // current position
    this.px = x; this.py = y;    // previous position (velocity is implicit)
    this.ax = 0; this.ay = 0;    // acceleration accumulated for this step
    this.baseInvMass = invMass;
    this.invMass = pinned ? 0 : invMass;
    this.contactH = false;       // touched floor or ceiling this step
    this.contactV = false;       // touched a side wall this step
  }
  get pinned() { return this.invMass === 0; }
}

class Body {
  constructor() { this.particles = []; }
  // `iter` is the relaxation pass index, 0 .. world.iterations-1. Most bodies
  // ignore it; a body applying a whole-shape force uses it to act once per
  // step rather than once per pass.
  satisfyConstraints(world, iter) {}
  draw(ctx, world) {}
  tear(x, y, radius) {}          // optional: right-drag cutting
}

const DT = 1 / 60;               // fixed simulation timestep
const MAX_STEPS = 5;             // catch-up cap so we never spiral

class World {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.bodies = [];
    this.gravity = 900;          // px / s^2
    this.gravityOn = true;
    this.wind = 600;             // px / s^2, gusting along +x
    this.windOn = false;
    this.damping = 0.995;        // velocity retained per step
    this.iterations = 8;         // relaxation passes per step
    this.stiffness = 1;          // 0..1, how hard constraints are enforced
    this.friction = 0.2;         // 0..1, tangential velocity lost on contact
    this.margin = 28;            // walls, inset from the canvas edge
    this.accumulator = 0;
    this.time = 0;
    this.paused = false;      // render loop only; step() ignores it
    this.grab = null;            // { p, wasPinned, vx, vy }
    this.mouse = { x: 0, y: 0 };
  }

  add(body) { this.bodies.push(body); return body; }
  clear() { this.bodies.length = 0; this.grab = null; }

  get width() { return this.canvas.width / DPR; }
  get height() { return this.canvas.height / DPR; }

  eachParticle(fn) {
    for (const b of this.bodies) for (const p of b.particles) fn(p, b);
  }

  particleCount() {
    let n = 0;
    for (const b of this.bodies) n += b.particles.length;
    return n;
  }

  linkCount() {
    let n = 0;
    for (const b of this.bodies)
      if (b.links) for (const L of b.links) if (!L.dead) n++;
    return n;
  }

  // Nearest particle to a point, within `radius`.
  pick(x, y, radius) {
    let best = null, bestD = radius * radius;
    this.eachParticle(p => {
      const dx = p.x - x, dy = p.y - y, d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = p; }
    });
    return best;
  }

  accumulateForces() {
    const gy = this.gravityOn ? this.gravity : 0;
    // A little sinusoidal gust so wind doesn't read as a constant tilt.
    const gx = this.windOn ? this.wind * (0.65 + 0.35 * Math.sin(this.time * 1.7)) : 0;
    this.eachParticle(p => { p.ax = gx; p.ay = gy; });
  }

  integrate() {
    const dt2 = DT * DT;
    this.eachParticle((p, body) => {
      if (p.invMass === 0) { p.px = p.x; p.py = p.y; return; }
      // A body may damp differently from the world: the global value settles
      // cloth nicely but kills a pendulum in about three seconds.
      const d = body.damping !== undefined ? body.damping : this.damping;
      const vx = (p.x - p.px) * d + p.ax * dt2;
      const vy = (p.y - p.py) * d + p.ay * dt2;
      p.px = p.x; p.py = p.y;
      p.x += vx; p.y += vy;
    });
  }

  // The dragged particle is pinned to the cursor, but we remember how fast
  // it travelled so releasing it flings the body instead of dropping it.
  followCursor() {
    const g = this.grab;
    if (!g) return;
    const p = g.p, max = 40;
    let dx = this.mouse.x - p.x, dy = this.mouse.y - p.y;
    const d = Math.hypot(dx, dy);
    if (d > max) { dx *= max / d; dy *= max / d; }
    p.x += dx; p.y += dy;
    g.vx = dx; g.vy = dy;
  }

  // Walls are a constraint like any other, so they are projected inside the
  // relaxation loop rather than once after it. Clamping only at the end let
  // each pass push a body's bottom row into the floor and its top row up by
  // the same amount; the clamp then cancelled just the bottom half, and the
  // leftover kick -- rectified by friction -- walked a dropped jelly ~209px.
  projectBounds() {
    const m = this.margin, w = this.width, h = this.height;
    this.eachParticle(p => {
      if (p.x < m) { p.x = m; p.contactV = true; }
      else if (p.x > w - m) { p.x = w - m; p.contactV = true; }
      if (p.y < m) { p.y = m; p.contactH = true; }
      else if (p.y > h - m) { p.y = h - m; p.contactH = true; }
    });
  }

  // Bleed the velocity running along each wall a particle touched this step.
  // Verlet keeps velocity implicit in (x - px), so shedding a fraction f of
  // it means walking the previous position that fraction closer to the
  // current one. Applied once per step: per pass it would compound eightfold.
  // Without this a wheel slides instead of rolling.
  applyFriction() {
    const f = this.friction;
    if (f <= 0) return;
    this.eachParticle(p => {
      if (p.contactH) p.px += (p.x - p.px) * f;   // floor or ceiling: bleed x
      if (p.contactV) p.py += (p.y - p.py) * f;   // side wall: bleed y
    });
  }

  step() {
    this.time += DT;
    this.accumulateForces();
    this.integrate();
    this.followCursor();
    this.eachParticle(p => { p.contactH = false; p.contactV = false; });
    for (let i = 0; i < this.iterations; i++) {
      for (const b of this.bodies) b.satisfyConstraints(this, i);
      this.projectBounds();
    }
    this.applyFriction();
  }

  // Fixed timestep with an accumulator: the sim always advances in 1/60s
  // slices no matter how fast or slow the display refreshes.
  // `paused` stops the render loop driving the sim; step() stays
  // unconditional so a test can advance it deterministically.
  update(frameSeconds) {
    if (this.paused) return;
    this.accumulator += Math.min(frameSeconds, 0.25);
    let steps = 0;
    while (this.accumulator >= DT && steps < MAX_STEPS) {
      this.step();
      this.accumulator -= DT;
      steps++;
    }
    // Drop the backlog only when the cap actually cut us short. A frame that
    // fit inside MAX_STEPS has legitimate sub-step time banked; discarding it
    // silently loses up to a frame of simulation.
    if (steps === MAX_STEPS && this.accumulator >= DT) this.accumulator = 0;
  }

  draw() {
    const ctx = this.ctx;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = "#0e1013";
    ctx.fillRect(0, 0, this.width, this.height);

    const m = this.margin;
    ctx.lineWidth = 1;
    ctx.strokeStyle = "#232932";
    ctx.strokeRect(m + 0.5, m + 0.5, this.width - 2 * m - 1, this.height - 2 * m - 1);

    for (const b of this.bodies) b.draw(ctx, this);
    if (this.grab) {
      ctx.strokeStyle = "#e6ebf2";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(this.grab.p.x, this.grab.p.y, 5, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  startDrag(x, y) {
    const p = this.pick(x, y, 30);
    if (!p) return false;
    this.grab = { p, wasInvMass: p.invMass, vx: 0, vy: 0 };
    p.invMass = 0;
    return true;
  }

  endDrag() {
    const g = this.grab;
    if (!g) return;
    g.p.invMass = g.wasInvMass;
    g.p.px = g.p.x - g.vx;      // hand back the drag velocity
    g.p.py = g.p.y - g.vy;
    this.grab = null;
  }

  tearAt(x, y, radius) {
    for (const b of this.bodies) b.tear(x, y, radius);
  }

  togglePin(x, y) {
    const p = this.pick(x, y, 24);
    if (p) {
      if (this.grab && this.grab.p === p) {
        // A grabbed particle is already held at invMass 0 by the drag, so
        // toggle what it returns to rather than the transient state -- else
        // pressing P mid-drag reads as "unpin" and is undone on release.
        const g = this.grab;
        g.wasInvMass = g.wasInvMass === 0 ? (p.baseInvMass || 1) : 0;
      } else {
        p.invMass = p.invMass === 0 ? (p.baseInvMass || 1) : 0;
        p.px = p.x; p.py = p.y;
      }
    }
    return p;
  }
}

/* --- helpers shared by any body built from distance constraints ---- */

// A link is a range constraint. A rigid one is the degenerate case where
// both ends of the range coincide, so one record and one solver serve both.
function makeLink(a, b, rest) {
  const r = rest !== undefined ? rest : Math.hypot(b.x - a.x, b.y - a.y);
  return { a, b, min: r, max: r, dead: false };
}

// A joint that may travel freely between two lengths -- used for limb limits,
// where a fixed length would lock the joint and no limit would let it fold
// back through itself. An inverted range is a caller error; normalise it so
// the solver converges rather than flipping between the two bounds forever.
function makeRange(a, b, min, max) {
  return { a, b, min: Math.min(min, max), max: Math.max(min, max), dead: false };
}

/* One relaxation pass over a list of links: push each pair back towards
   its allowed length, sharing the correction in proportion to inverse mass
   so the lighter end travels further. With both ends at invMass 1 this
   reduces to an even split, which is what the pre-mass solver did. */
function solveLinks(links, k) {
  for (const L of links) {
    if (L.dead) continue;
    const a = L.a, b = L.b;
    const wSum = a.invMass + b.invMass;
    if (wSum === 0) continue;              // nothing here can move
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 1e-6;
    const target = d < L.min ? L.min : (d > L.max ? L.max : d);
    if (target === d) continue;            // already inside the allowed range
    const scale = ((d - target) / d) * k / wSum;
    const ox = dx * scale, oy = dy * scale;
    a.x += ox * a.invMass; a.y += oy * a.invMass;
    b.x -= ox * b.invMass; b.y -= oy * b.invMass;
  }
}

function tearLinks(links, x, y, radius) {
  for (const L of links)
    if (!L.dead && distToSegment(x, y, L.a.x, L.a.y, L.b.x, L.b.y) < radius) L.dead = true;
}

function strokeLinks(ctx, links, color) {
  ctx.lineWidth = 1;
  ctx.strokeStyle = color;
  ctx.beginPath();
  for (const L of links) {
    if (L.dead) continue;
    ctx.moveTo(L.a.x, L.a.y);
    ctx.lineTo(L.b.x, L.b.y);
  }
  ctx.stroke();
}

/* Restore a closed ring towards its rest area by pushing every vertex along
   its outward normal. Moving the whole ring out by h changes the enclosed
   area by about perimeter * h, so that is the offset to ask for.

   Pressure is an internal force, so it must not translate the body: the
   mean displacement is subtracted, and the blob applies this once per step
   rather than once per relaxation pass, since repeating it compounds.

   KNOWN LIMITATION: this term pumps energy. With pressure on, the blob's
   kinetic energy plateaus (~15 per 100-step block) and never decays; with
   pressure off it reaches zero within 200 steps. At friction 0 the blob
   oscillates in place with no drift; at friction 0.2 the same oscillation
   is rectified into ~290px of walking over 900 steps. Projecting walls
   inside the solver loop -- which fixed the jelly's walking -- does not
   change this. The jelly no longer uses this helper: it holds volume with a
   signed-area constraint per cell (solveArea), which cannot translate the
   body by construction. */
function solvePressure(ring, restArea, signedArea, pressure) {
  const n = ring.length;
  if (n < 3) return;
  let perimeter = 0;
  for (let i = 0; i < n; i++) {
    const p = ring[i], q = ring[(i + 1) % n];
    perimeter += Math.hypot(q.x - p.x, q.y - p.y);
  }
  if (perimeter < 1e-6) return;

  const sign = signedArea < 0 ? -1 : 1;
  const h = Math.max(-6, Math.min(6,
    ((restArea - Math.abs(signedArea)) / perimeter) * pressure));
  if (h === 0) return;

  const dx = new Array(n), dy = new Array(n);
  let mx = 0, my = 0, free = 0;
  for (let i = 0; i < n; i++) {
    const prev = ring[(i - 1 + n) % n], next = ring[(i + 1) % n];
    const ex = next.x - prev.x, ey = next.y - prev.y;
    const len = Math.hypot(ex, ey) || 1e-6;
    if (ring[i].invMass === 0) { dx[i] = 0; dy[i] = 0; continue; }
    dx[i] = (ey / len) * sign * h;
    dy[i] = (-ex / len) * sign * h;
    mx += dx[i]; my += dy[i]; free++;
  }
  if (free === 0) return;
  mx /= free; my /= free;
  for (let i = 0; i < n; i++) {
    if (dx[i] === 0 && dy[i] === 0) continue;
    ring[i].x += dx[i] - mx;
    ring[i].y += dy[i] - my;
  }
}

/* Hold a polygon's *signed* area at its rest value. Distance constraints
   cannot do this: a braced quad is rigid only up to reflection, so a cell
   slammed inside-out still satisfies every edge and diagonal and stays
   folded for good. Signed area can tell the two apart -- an inverted cell
   reads as -rest, the largest error there is, and is driven straight back.

   Standard position-based form: C = A - rest, with the gradient of polygon
   area at vertex i being half the perpendicular of (next - prev). Those
   gradients sum to zero, so the correction reshapes the cell without ever
   moving it, which is why this needs none of solvePressure's translation
   bookkeeping. */
function solveArea(poly, rest, k) {
  const n = poly.length;
  let area = 0;
  for (let i = 0; i < n; i++) {
    const p = poly[i], q = poly[(i + 1) % n];
    area += p.x * q.y - q.x * p.y;
  }
  const C = area * 0.5 - rest;
  if (C === 0) return;
  let denom = 0;
  const gx = new Array(n), gy = new Array(n);
  for (let i = 0; i < n; i++) {
    const prev = poly[(i - 1 + n) % n], next = poly[(i + 1) % n];
    gx[i] = 0.5 * (next.y - prev.y);
    gy[i] = 0.5 * (prev.x - next.x);
    denom += poly[i].invMass * (gx[i] * gx[i] + gy[i] * gy[i]);
  }
  if (denom < 1e-12) return;
  const s = (C / denom) * k;
  for (let i = 0; i < n; i++) {
    const p = poly[i];
    p.x -= s * p.invMass * gx[i];
    p.y -= s * p.invMass * gy[i];
  }
}

/* Distance of point (px,py) to segment ab -- used for tearing. */
function distToSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len2 = dx * dx + dy * dy;
  let t = len2 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}

/* ------------------------------------------------------------------ *
 * Cloth
 * ------------------------------------------------------------------ */

class Cloth extends Body {
  constructor(cols, rows, spacing, ox, oy) {
    super();
    this.cols = cols; this.rows = rows; this.spacing = spacing;
    this.links = [];
    for (let y = 0; y < rows; y++)
      for (let x = 0; x < cols; x++)
        this.particles.push(new Particle(ox + x * spacing, oy + y * spacing, y === 0));

    const at = (x, y) => this.particles[y * cols + x];
    for (let y = 0; y < rows; y++)
      for (let x = 0; x < cols; x++) {
        if (x < cols - 1) this.link(at(x, y), at(x + 1, y));
        if (y < rows - 1) this.link(at(x, y), at(x, y + 1));
      }
  }

  link(a, b) { this.links.push(makeLink(a, b)); }

  satisfyConstraints(world) { solveLinks(this.links, world.stiffness); }

  tear(x, y, radius) { tearLinks(this.links, x, y, radius); }

  draw(ctx) {
    strokeLinks(ctx, this.links, "#8d97a6");
    drawOrphans(ctx, this.particles, this.links);
    drawPins(ctx, this.particles);
  }
}

/* ------------------------------------------------------------------ *
 * Rope -- a chain of particles, hung from its first point.
 * ------------------------------------------------------------------ */

class Rope extends Body {
  constructor(x, y, segments, spacing, opts = {}) {
    super();
    this.links = [];
    const last = segments - 1;
    for (let i = 0; i < segments; i++)
      this.particles.push(new Particle(
        x + i * spacing, y,
        (i === 0 && opts.pinFirst !== false) || (i === last && opts.pinLast === true)));
    for (let i = 0; i < segments - 1; i++)
      this.links.push(makeLink(this.particles[i], this.particles[i + 1]));
  }

  satisfyConstraints(world) { solveLinks(this.links, world.stiffness); }

  tear(x, y, radius) { tearLinks(this.links, x, y, radius); }

  draw(ctx) {
    strokeLinks(ctx, this.links, "#9aa4b3");
    ctx.fillStyle = "#5d6675";
    for (const p of this.particles) ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
    drawPins(ctx, this.particles);
  }
}

/* ------------------------------------------------------------------ *
 * Blob -- a closed ring of particles held out by gas pressure.
 * The ring links stop it stretching; the pressure term compares the
 * polygon's current signed area to its rest area and pushes every
 * vertex along its outward normal until the two agree.
 * ------------------------------------------------------------------ */

class Blob extends Body {
  constructor(cx, cy, radius, count) {
    super();
    this.links = [];
    this.pressure = 0.9;
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2;
      this.particles.push(new Particle(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius));
    }
    for (let i = 0; i < count; i++)
      this.links.push(makeLink(this.particles[i], this.particles[(i + 1) % count]));
    this.restArea = Math.abs(this.area());
  }

  area() {
    const ps = this.particles;
    let a = 0;
    for (let i = 0, n = ps.length; i < n; i++) {
      const p = ps[i], q = ps[(i + 1) % n];
      a += p.x * q.y - q.x * p.y;
    }
    return a * 0.5;
  }

  satisfyConstraints(world, iter) {
    solveLinks(this.links, world.stiffness);
    // Once per step, not once per relaxation pass: repeating it compounds
    // against the wall clamp and drives the body sideways.
    if (iter === world.iterations - 1)
      solvePressure(this.particles, this.restArea, this.area(), this.pressure);
  }

  tear(x, y, radius) { tearLinks(this.links, x, y, radius); }

  draw(ctx) {
    strokeLinks(ctx, this.links, "#9aa4b3");
    ctx.fillStyle = "#5d6675";
    for (const p of this.particles) ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
    drawPins(ctx, this.particles);
  }
}

/* ------------------------------------------------------------------ *
 * Circles -- a box of colliding discs. No links at all: the constraint
 * it satisfies is simply "no two discs overlap, and none leaves the box".
 * ------------------------------------------------------------------ */

class Circles extends Body {
  constructor(count, box) {
    super();
    this.box = box;                              // { x, y, w, h }
    this.radii = [];
    for (let i = 0; i < count; i++) {
      const r = 8 + Math.random() * 14;
      this.radii.push(r);
      this.particles.push(new Particle(
        box.x + r + Math.random() * (box.w - 2 * r),
        box.y + r + Math.random() * (box.h * 0.6)));
    }
  }

  satisfyConstraints(world) {
    const ps = this.particles, r = this.radii, n = ps.length;
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const a = ps[i], b = ps[j], min = r[i] + r[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d2 = dx * dx + dy * dy;
        if (d2 >= min * min) continue;
        if (d2 < 1e-9) { dx = (i - j) * 0.01; dy = 0.01; d2 = dx * dx + dy * dy; }
        const d = Math.sqrt(d2);
        const off = (min - d) / d * 0.5;
        const ox = dx * off, oy = dy * off;
        if (a.invMass !== 0) { a.x -= ox; a.y -= oy; }
        if (b.invMass !== 0) { b.x += ox; b.y += oy; }
      }
    }
    const bx = this.box;
    for (let i = 0; i < n; i++) {
      const p = ps[i], rad = r[i];
      if (p.x < bx.x + rad) p.x = bx.x + rad;
      if (p.x > bx.x + bx.w - rad) p.x = bx.x + bx.w - rad;
      if (p.y < bx.y + rad) p.y = bx.y + rad;
      if (p.y > bx.y + bx.h - rad) p.y = bx.y + bx.h - rad;
    }
  }

  draw(ctx) {
    const bx = this.box;
    ctx.lineWidth = 1;
    ctx.strokeStyle = "#333b46";
    ctx.strokeRect(bx.x + 0.5, bx.y + 0.5, bx.w, bx.h);

    ctx.strokeStyle = "#9aa4b3";
    ctx.beginPath();
    for (let i = 0; i < this.particles.length; i++) {
      const p = this.particles[i], rad = this.radii[i];
      ctx.moveTo(p.x + rad, p.y);
      ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
    }
    ctx.stroke();
    drawPins(ctx, this.particles);
  }
}

/* ------------------------------------------------------------------ *
 * Ragdoll -- limbs held by rigid bones, with a range constraint spanning
 * each joint. A bone fixes a length; the span across two bones bounds the
 * angle between them, which is what stops an elbow folding through itself.
 * ------------------------------------------------------------------ */

class Ragdoll extends Body {
  constructor(cx, cy, scale = 1) {
    super();
    this.links = [];
    const S = scale;
    const P = (x, y, invMass) => {
      const p = new Particle(cx + x * S, cy + y * S, false, invMass);
      this.particles.push(p);
      return p;
    };
    // Heavier through the middle, lighter at the extremities.
    this.head     = P(0, -46, 0.9);
    this.neck     = P(0, -30, 0.5);
    this.pelvis   = P(0,  10, 0.35);
    this.shoulderL = P(-16, -24, 0.7);
    this.shoulderR = P( 16, -24, 0.7);
    this.elbowL   = P(-30,  -4, 1.2);
    this.elbowR   = P( 30,  -4, 1.2);
    this.handL    = P(-38,  20, 1.6);
    this.handR    = P( 38,  20, 1.6);
    this.hipL     = P(-12,  14, 0.6);
    this.hipR     = P( 12,  14, 0.6);
    this.kneeL    = P(-16,  46, 1.0);
    this.kneeR    = P( 16,  46, 1.0);
    this.footL    = P(-18,  76, 1.4);
    this.footR    = P( 18,  76, 1.4);

    const bone = (a, b) => this.links.push(makeLink(a, b));
    bone(this.head, this.neck);
    bone(this.neck, this.shoulderL); bone(this.neck, this.shoulderR);
    bone(this.shoulderL, this.shoulderR);
    bone(this.shoulderL, this.elbowL); bone(this.elbowL, this.handL);
    bone(this.shoulderR, this.elbowR); bone(this.elbowR, this.handR);
    bone(this.neck, this.pelvis);
    bone(this.pelvis, this.hipL); bone(this.pelvis, this.hipR);
    bone(this.hipL, this.hipR);
    bone(this.hipL, this.kneeL); bone(this.kneeL, this.footL);
    bone(this.hipR, this.kneeR); bone(this.kneeR, this.footR);
    // Torso bracing so the trunk does not shear flat.
    bone(this.shoulderL, this.pelvis); bone(this.shoulderR, this.pelvis);

    // Joint limits: the span from shoulder to hand may neither collapse
    // (elbow folded shut) nor reach the straight-arm length exactly.
    const joint = (a, b, minFrac, maxFrac) => {
      const straight = Math.hypot(b.x - a.x, b.y - a.y);
      this.joints = this.joints || [];
      const L = makeRange(a, b, straight * minFrac, straight * maxFrac);
      this.links.push(L);
      this.joints.push(L);
    };
    joint(this.shoulderL, this.handL, 0.45, 0.98);
    joint(this.shoulderR, this.handR, 0.45, 0.98);
    joint(this.hipL, this.footL, 0.55, 0.98);
    joint(this.hipR, this.footR, 0.55, 0.98);
    joint(this.head, this.pelvis, 0.80, 1.0);
  }

  satisfyConstraints(world) { solveLinks(this.links, world.stiffness); }
  tear(x, y, radius) { tearLinks(this.links, x, y, radius); }

  draw(ctx) {
    strokeLinks(ctx, this.links, "#9aa4b3");
    ctx.strokeStyle = "#e6ebf2";
    ctx.lineWidth = 1;
    ctx.beginPath();
    const r = Math.hypot(this.head.x - this.neck.x, this.head.y - this.neck.y) * 0.55;
    ctx.moveTo(this.head.x + r, this.head.y);
    ctx.arc(this.head.x, this.head.y, r, 0, Math.PI * 2);
    ctx.stroke();
    drawOrphans(ctx, this.particles, this.links);
    drawPins(ctx, this.particles);
  }
}

/* ------------------------------------------------------------------ *
 * Wheel -- a braced rim around a hub. Spokes fix the radius, rim links
 * fix the circumference, and chords across the rim stop it shearing into
 * an ellipse. Friction at the floor turns a shove into a roll.
 * ------------------------------------------------------------------ */

class Wheel extends Body {
  constructor(cx, cy, radius, spokes = 18) {
    super();
    this.links = [];
    this.radius = radius;
    this.hub = new Particle(cx, cy, false, 0.6);
    this.particles.push(this.hub);
    this.rim = [];
    for (let i = 0; i < spokes; i++) {
      const a = (i / spokes) * Math.PI * 2;
      const p = new Particle(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius);
      this.rim.push(p);
      this.particles.push(p);
    }
    for (let i = 0; i < spokes; i++) {
      this.links.push(makeLink(this.hub, this.rim[i]));
      this.links.push(makeLink(this.rim[i], this.rim[(i + 1) % spokes]));
      // Chord bracing: without it the rim folds instead of rolling.
      this.links.push(makeLink(this.rim[i], this.rim[(i + (spokes >> 2)) % spokes]));
    }
    this.markIndex = 0;
  }

  // Angle of one tracked rim point about the hub, used to tell a roll from
  // a slide: a sliding wheel translates without this changing.
  spinAngle() {
    const p = this.rim[this.markIndex];
    return Math.atan2(p.y - this.hub.y, p.x - this.hub.x);
  }

  satisfyConstraints(world) { solveLinks(this.links, world.stiffness); }
  tear(x, y, radius) { tearLinks(this.links, x, y, radius); }

  draw(ctx) {
    strokeLinks(ctx, this.links, "#79838f");
    ctx.strokeStyle = "#e6ebf2";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < this.rim.length; i++) {
      const p = this.rim[i];
      if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
    ctx.stroke();
    // A single spoke drawn bright, so rotation is visible at a glance.
    ctx.beginPath();
    ctx.moveTo(this.hub.x, this.hub.y);
    ctx.lineTo(this.rim[this.markIndex].x, this.rim[this.markIndex].y);
    ctx.stroke();
    drawPins(ctx, this.particles);
  }
}

/* ------------------------------------------------------------------ *
 * Spring -- a chain whose segments may travel between a compressed and an
 * extended length, so it visibly stretches under load where a rope holds
 * its length. Drawn as a coil rather than a line.
 * ------------------------------------------------------------------ */

class Spring extends Body {
  constructor(x, y, coils, segment, stretch = 2.2) {
    super();
    this.links = [];
    this.isSpring = true;
    this.naturalLength = segment * (coils - 1);
    for (let i = 0; i < coils; i++)
      this.particles.push(new Particle(x, y + i * segment, i === 0));
    for (let i = 0; i < coils - 1; i++)
      this.links.push(makeRange(this.particles[i], this.particles[i + 1],
                                segment * 0.35, segment * stretch));
  }

  satisfyConstraints(world) { solveLinks(this.links, world.stiffness); }
  tear(x, y, radius) { tearLinks(this.links, x, y, radius); }

  draw(ctx) {
    ctx.strokeStyle = "#9aa4b3";
    ctx.lineWidth = 1;
    ctx.beginPath();
    const ps = this.particles;
    ctx.moveTo(ps[0].x, ps[0].y);
    // Several zig-zags per segment at a fixed amplitude. Scaling the
    // amplitude by segment length made an extended spring collapse into a
    // near-straight line, which read as a wire rather than a coil.
    const AMP = 6, ZIGS = 4;
    for (let i = 1; i < ps.length; i++) {
      const a = ps[i - 1], b = ps[i];
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1e-6;
      const nx = -dy / len, ny = dx / len;
      for (let j = 1; j <= ZIGS; j++) {
        const t = j / ZIGS;
        const off = j === ZIGS ? 0 : (j % 2 ? AMP : -AMP);
        ctx.lineTo(a.x + dx * t + nx * off, a.y + dy * t + ny * off);
      }
    }
    ctx.stroke();
    drawOrphans(ctx, this.particles, this.links);
    drawPins(ctx, this.particles);
  }
}

/* ------------------------------------------------------------------ *
 * Bridge -- a plank deck slung between two anchors, with hangers to a
 * catenary cable above. Load anywhere on the deck spreads through the
 * cable, which is the whole point of the shape.
 * ------------------------------------------------------------------ */

class Bridge extends Body {
  constructor(x, y, span, planks) {
    super();
    this.links = [];
    this.deck = [];
    this.cable = [];
    const step = span / (planks - 1);
    for (let i = 0; i < planks; i++) {
      const pinned = i === 0 || i === planks - 1;
      const d = new Particle(x + i * step, y + 70, pinned);
      this.deck.push(d);
      this.particles.push(d);
    }
    for (let i = 0; i < planks; i++) {
      const pinned = i === 0 || i === planks - 1;
      // Cable starts sagging so it settles into a catenary rather than
      // snapping taut on the first step.
      const t = i / (planks - 1);
      const sag = Math.sin(t * Math.PI) * 34;
      const c = new Particle(x + i * step, y + sag, pinned, 0.8);
      this.cable.push(c);
      this.particles.push(c);
    }
    for (let i = 0; i < planks - 1; i++) {
      this.links.push(makeLink(this.deck[i], this.deck[i + 1]));
      this.links.push(makeLink(this.cable[i], this.cable[i + 1]));
    }
    for (let i = 0; i < planks; i++)
      this.links.push(makeLink(this.cable[i], this.deck[i]));
  }

  satisfyConstraints(world) { solveLinks(this.links, world.stiffness); }
  tear(x, y, radius) { tearLinks(this.links, x, y, radius); }

  draw(ctx) {
    strokeLinks(ctx, this.links, "#79838f");
    ctx.strokeStyle = "#e6ebf2";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < this.deck.length; i++) {
      const p = this.deck[i];
      if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
    drawOrphans(ctx, this.particles, this.links);
    drawPins(ctx, this.particles);
  }
}

/* ------------------------------------------------------------------ *
 * Jelly -- a filled grid with shear bracing, and a signed-area constraint
 * on every cell so no cell can be folded inside-out. It wobbles and
 * recovers where the cloth would simply fold.
 * ------------------------------------------------------------------ */

class Jelly extends Body {
  constructor(cx, cy, cols, rows, spacing) {
    super();
    this.links = [];
    this.cols = cols; this.rows = rows;
    const ox = cx - ((cols - 1) * spacing) / 2;
    const oy = cy - ((rows - 1) * spacing) / 2;
    for (let y = 0; y < rows; y++)
      for (let x = 0; x < cols; x++)
        this.particles.push(new Particle(ox + x * spacing, oy + y * spacing));
    const at = (x, y) => this.particles[y * cols + x];
    for (let y = 0; y < rows; y++)
      for (let x = 0; x < cols; x++) {
        if (x < cols - 1) this.links.push(makeLink(at(x, y), at(x + 1, y)));
        if (y < rows - 1) this.links.push(makeLink(at(x, y), at(x, y + 1)));
        // Diagonals are what make it a solid rather than a cloth.
        if (x < cols - 1 && y < rows - 1) {
          this.links.push(makeLink(at(x, y), at(x + 1, y + 1)));
          this.links.push(makeLink(at(x + 1, y), at(x, y + 1)));
        }
      }
    // Each cell wound a -> b -> c -> d, with the signed area it was built at.
    this.cells = [];
    for (let y = 0; y < rows - 1; y++)
      for (let x = 0; x < cols - 1; x++) {
        const poly = [at(x, y), at(x + 1, y), at(x + 1, y + 1), at(x, y + 1)];
        let a2 = 0;
        for (let i = 0; i < 4; i++) {
          const p = poly[i], q = poly[(i + 1) % 4];
          a2 += p.x * q.y - q.x * p.y;
        }
        this.cells.push({ poly, rest: a2 * 0.5 });
      }
    this.hull = [];
    for (let x = 0; x < cols; x++) this.hull.push(at(x, 0));
    for (let y = 1; y < rows; y++) this.hull.push(at(cols - 1, y));
    for (let x = cols - 2; x >= 0; x--) this.hull.push(at(x, rows - 1));
    for (let y = rows - 2; y >= 1; y--) this.hull.push(at(0, y));
    this.restArea = Math.abs(this.area());
  }

  area() {
    const ps = this.hull;
    let a = 0;
    for (let i = 0, n = ps.length; i < n; i++) {
      const p = ps[i], q = ps[(i + 1) % n];
      a += p.x * q.y - q.x * p.y;
    }
    return a * 0.5;
  }

  satisfyConstraints(world) {
    solveLinks(this.links, world.stiffness);
    for (const c of this.cells) solveArea(c.poly, c.rest, world.stiffness);
  }

  tear(x, y, radius) { tearLinks(this.links, x, y, radius); }

  draw(ctx) {
    strokeLinks(ctx, this.links, "#5f6874");
    ctx.strokeStyle = "#e6ebf2";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < this.hull.length; i++) {
      const p = this.hull[i];
      if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
    ctx.stroke();
    drawPins(ctx, this.particles);
  }
}

/* ------------------------------------------------------------------ *
 * Pendulum -- a heavy bob on a stiff arm. A short chain of rigid links
 * rather than one, so the arm reads as a line and converges quickly.
 * ------------------------------------------------------------------ */

class Pendulum extends Body {
  constructor(x, y, length, bobMass = 0.25, segments = 6) {
    super();
    this.links = [];
    // Near-lossless: a pendulum that stops swinging demonstrates nothing.
    this.damping = 0.9998;
    const step = length / segments;
    this.pivot = new Particle(x, y, true);
    this.particles.push(this.pivot);
    let prev = this.pivot;
    for (let i = 1; i <= segments; i++) {
      // Light arm, heavy bob: the mass model is what makes this swing like
      // a pendulum rather than a rope.
      const isBob = i === segments;
      const p = new Particle(x + i * step, y, false, isBob ? bobMass : 2.5);
      this.particles.push(p);
      this.links.push(makeLink(prev, p, step));
      prev = p;
    }
    this.bob = prev;
  }

  satisfyConstraints(world) { solveLinks(this.links, world.stiffness); }
  tear(x, y, radius) { tearLinks(this.links, x, y, radius); }

  draw(ctx) {
    strokeLinks(ctx, this.links, "#9aa4b3");
    ctx.strokeStyle = "#e6ebf2";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(this.bob.x + 7, this.bob.y);
    ctx.arc(this.bob.x, this.bob.y, 7, 0, Math.PI * 2);
    ctx.stroke();
    drawOrphans(ctx, this.particles, this.links);
    drawPins(ctx, this.particles);
  }
}

function drawPins(ctx, particles) {
  ctx.fillStyle = "#e6ebf2";
  for (const p of particles)
    if (p.pinned) ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
}

/* A particle whose links have all been torn draws nothing, yet it still
   falls and can still be grabbed. Mark the ones that survive on a link and
   give the rest a dot, so nothing on screen is invisible but interactive. */
function drawOrphans(ctx, particles, links) {
  const attached = new Set();
  for (const L of links) {
    if (L.dead) continue;
    attached.add(L.a); attached.add(L.b);
  }
  if (attached.size === particles.length) return;
  ctx.fillStyle = "#8d97a6";
  for (const p of particles)
    if (!attached.has(p) && !p.pinned) ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
}

/* ------------------------------------------------------------------ *
 * Boot
 * ------------------------------------------------------------------ */

const canvas = document.getElementById("view");
const legend = document.getElementById("legend");
let DPR = Math.min(window.devicePixelRatio || 1, 2);
const world = new World(canvas);

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(window.innerWidth * DPR);
  canvas.height = Math.floor(window.innerHeight * DPR);
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
}
window.addEventListener("resize", resize);
resize();

/* --- scenes ------------------------------------------------------ *
 * Each scene is just a function returning bodies. Adding a body type
 * means writing the class and listing it here; the world does the rest.
 * ------------------------------------------------------------------ */

const SCENES = {
  cloth: w => {
    const cols = 40, rows = 30;
    // Keep the grid at 40x30 but shrink the spacing so it fits the window.
    const spacing = Math.min(14,
      (w.width - 2 * w.margin - 40) / (cols - 1),
      (w.height * 0.62) / (rows - 1));
    return [new Cloth(cols, rows, spacing,
                      (w.width - (cols - 1) * spacing) / 2, w.margin + 32)];
  },
  rope: w => {
    const out = [];
    const span = Math.min(560, w.width - 300), left = (w.width - span) / 2 - 40;
    // three catenaries of increasing slack, strung between two pins...
    for (let i = 0; i < 3; i++) {
      const n = 40 + i * 14;
      out.push(new Rope(left, 90 + i * 34, n, span / (n - 1), { pinLast: true }));
    }
    // ...and one hanging free from a single pin, clear of the others.
    out.push(new Rope(w.margin + 60, 90, 60, 7));
    return out;
  },
  blob: w => [
    new Blob(w.width * 0.5, w.height * 0.30, 110, 48),
    new Blob(w.width * 0.5 - 210, w.height * 0.22, 70, 32),
  ],
  circles: w => {
    const bw = Math.min(760, w.width - 120), bh = Math.min(520, w.height - 120);
    return [new Circles(70, { x: (w.width - bw) / 2, y: (w.height - bh) / 2, w: bw, h: bh })];
  },
  ragdoll: w => {
    const out = [];
    for (let i = 0; i < 3; i++) {
      const r = new Ragdoll(w.width * 0.5 + (i - 1) * 210, 150, 1.5);
      r.head.invMass = 0;              // hung by the head, puppet fashion
      // Give the outer two a shove so they swing rather than hang plumb.
      if (i !== 1) for (const p of r.particles) p.px = p.x + (i === 0 ? 7 : -7);
      out.push(r);
    }
    return out;
  },
  wheel: w => {
    // Rolling is against the floor: bodies do not yet collide with one
    // another, so there is deliberately nothing here but wheels and ground.
    const out = [new Wheel(w.width * 0.5 - 210, w.height * 0.34, 80, 20),
                 new Wheel(w.width * 0.5 + 40, w.height * 0.26, 54, 16),
                 new Wheel(w.width * 0.5 + 240, w.height * 0.40, 38, 14)];
    for (const wheel of out)
      for (const p of wheel.particles) p.px = p.x - 5;   // set them rolling
    return out;
  },
  spring: w => {
    const out = [];
    for (let i = 0; i < 4; i++)
      out.push(new Spring(w.width * 0.5 - 180 + i * 120, 70, 16, 16, 1.6 + i * 0.5));
    return out;
  },
  bridge: w => {
    const span = Math.min(560, w.width - 320);
    return [new Bridge((w.width - span) / 2, w.height * 0.30, span, 26)];
  },
  jelly: w => [
    new Jelly(w.width * 0.5 - 150, w.height * 0.52, 8, 8, 20),
    new Jelly(w.width * 0.5 + 120, w.height * 0.44, 6, 6, 24),
  ],
  pendulum: w => {
    const out = [];
    for (let i = 0; i < 3; i++)
      out.push(new Pendulum(w.width * 0.5 - 170 + i * 170, 90, 150 + i * 30, 0.2, 6));
    return out;
  },
  mixed: w => [
    new Cloth(20, 16, 13, 60, 60),
    new Rope(w.width * 0.5 - 40, 80, 55, 9),
    new Blob(w.width * 0.5, w.height * 0.6, 80, 36),
    new Circles(24, { x: w.width - 340, y: w.height - 300, w: 300, h: 260 }),
  ],
};

let scene = "cloth";

function reset() {
  world.clear();
  for (const body of SCENES[scene](world)) world.add(body);
}

function setScene(name) {
  if (!SCENES[name]) return;
  scene = name;
  reset();
}
reset();

/* --- input ------------------------------------------------------- */

const TEAR_RADIUS = 12;
let tearing = false;

function mousePos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

canvas.addEventListener("contextmenu", e => e.preventDefault());

canvas.addEventListener("pointerdown", e => {
  const m = mousePos(e);
  world.mouse = m;
  canvas.setPointerCapture(e.pointerId);
  if (e.button === 2) { tearing = true; world.tearAt(m.x, m.y, TEAR_RADIUS); }
  else if (e.button === 0) world.startDrag(m.x, m.y);
});

// Listen on the window, not the canvas: over the panel the canvas sees no
// move events at all, which left world.mouse stale for the P shortcut.
window.addEventListener("pointermove", e => {
  const m = mousePos(e);
  world.mouse = m;
  // A second button pressed during a drag fires no pointerdown, so the only
  // live signal that the right button is held is `buttons` on the move.
  if (tearing || (e.buttons & 2)) world.tearAt(m.x, m.y, TEAR_RADIUS);
});

function endPointer(e) {
  // pointerup only arrives once the last button lifts, so this ends both.
  tearing = false;
  world.endDrag();
  if (e && e.pointerId != null && canvas.hasPointerCapture(e.pointerId))
    canvas.releasePointerCapture(e.pointerId);
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
window.addEventListener("blur", () => endPointer(null));

window.addEventListener("keydown", e => {
  const t = e.target;
  // Sliders and checkboxes keep their own arrow-key behaviour; only text
  // fields would actually swallow letters, so that is all we skip.
  if (t && (t.tagName === "TEXTAREA" ||
           (t.tagName === "INPUT" && !/^(range|checkbox)$/.test(t.type)))) return;
  switch (e.key.toLowerCase()) {
    case "r": reset(); break;
    case "g": world.gravityOn = !world.gravityOn; break;
    case "w": world.windOn = !world.windOn; break;
    case "p": world.togglePin(world.mouse.x, world.mouse.y); break;
    case "[": case "]": {
      // Eleven scenes outgrew the number row; bracket keys walk the list.
      const names = Object.keys(SCENES);
      const at = names.indexOf(scene);
      const next = (at + (e.key === "]" ? 1 : names.length - 1)) % names.length;
      setScene(names[next]);
      break;
    }
    default: {
      const names = Object.keys(SCENES);
      const i = "123456789".indexOf(e.key);
      if (i >= 0 && names[i]) setScene(names[i]);
    }
  }
});

/* --- control panel ----------------------------------------------- *
 * Each control is a plain input bound to one world field; syncPanel()
 * pushes state back the other way so the keyboard shortcuts stay honest.
 * ------------------------------------------------------------------ */

const $ = id => document.getElementById(id);

function bindRange(inputId, get, set, format) {
  const input = $(inputId), out = $(inputId.replace("i-", "v-"));
  input.value = get();
  out.textContent = format(get());
  input.addEventListener("input", () => {
    set(parseFloat(input.value));
    out.textContent = format(get());
  });
  return () => { input.value = get(); out.textContent = format(get()); };
}

function bindCheck(inputId, get, set) {
  const input = $(inputId);
  input.checked = get();
  input.addEventListener("change", () => set(input.checked));
  return () => { input.checked = get(); };
}

const sceneSelect = $("i-scene");
sceneSelect.value = scene;
sceneSelect.addEventListener("change", () => setScene(sceneSelect.value));

const syncers = [
  () => { sceneSelect.value = scene; },
  bindRange("i-gravity", () => world.gravity, v => world.gravity = v, v => v.toFixed(0)),
  bindRange("i-wind", () => world.wind, v => world.wind = v, v => v.toFixed(0)),
  bindRange("i-stiff", () => world.stiffness, v => world.stiffness = v, v => v.toFixed(2)),
  bindRange("i-friction", () => world.friction, v => world.friction = v, v => v.toFixed(2)),
  bindRange("i-iter", () => world.iterations, v => world.iterations = v, v => v.toFixed(0)),
  bindCheck("i-gravity-on", () => world.gravityOn, v => world.gravityOn = v),
  bindCheck("i-wind-on", () => world.windOn, v => world.windOn = v),
];
const syncPanel = () => syncers.forEach(fn => fn());

/* --- loop -------------------------------------------------------- */

let last = performance.now();
let fps = 60, statsAt = 0;

function frame(now) {
  const dt = (now - last) / 1000;
  last = now;
  if (dt > 0) fps += ((1 / dt) - fps) * 0.1;   // smoothed, not jittery

  world.update(dt);
  world.draw();

  if (now - statsAt > 250) {                   // DOM writes don't need 60Hz
    statsAt = now;
    $("v-fps").textContent = Math.round(fps);
    $("v-count").textContent = world.particleCount();
    $("v-links").textContent = world.linkCount();
    syncPanel();
  }

  legend.innerHTML =
    "drag <b>left</b> · tear <b>right</b> · pin <b>P</b> · gravity <b>G</b> " +
    (world.gravityOn ? "on" : "off") +
    " · wind <b>W</b> " + (world.windOn ? "on" : "off") +
    " · reset <b>R</b> · scenes <b>1-9</b> <b>[</b> <b>]</b>";
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__world = world; // handy for poking from the console
</script>
</body>
</html>
